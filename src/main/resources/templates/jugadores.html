<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Jugadores</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial; background: #f0f4f8; padding: 20px; }
  nav { background: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
  nav a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
  nav a:hover { color: #27ae60; }
  h1, h2 { color: #2c3e50; margin-bottom: 15px; }
  .container { display: flex; gap: 30px; flex-wrap: wrap; }
  .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .form-card { min-width: 320px; flex: 1; }
  .list-card { flex: 2; }
  label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
  input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
  .btn { background: #27ae60; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; width: 100%; }
  .btn:hover { background: #219a52; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #2c3e50; color: white; padding: 10px; font-size: 13px; }
  td { padding: 9px; border-bottom: 1px solid #ddd; text-align: center; font-size: 13px; }
  tr:hover { background: #f9f9f9; }
</style>
</head>
<body>
<nav>
  <a href="/clubes">⚽ Clubes</a>
  <a href="/entrenadores">🧑‍💼 Entrenadores</a>
  <a href="/jugadores">🏃 Jugadores</a>
  <a href="/asociaciones">🏛️ Asociaciones</a>
  <a href="/competiciones">🏆 Competiciones</a>
</nav>

<h1>🏃 Gestión de Jugadores</h1>
<div class="container">

  <div class="card form-card">
    <h2>➕ Registrar Jugador</h2>
    <form th:action="@{/jugadores/guardar}" th:object="${jugador}" method="post">
      <label>Nombre:</label>
      <input type="text" th:field="*{nombre}" placeholder="Ej: James" required/>
      <label>Apellido:</label>
      <input type="text" th:field="*{apellido}" placeholder="Ej: Rodríguez" required/>
      <label>Número de camiseta:</label>
      <input type="number" th:field="*{numero}" placeholder="Ej: 10" min="1" max="99" required/>
      <label>Posición:</label>
      <select th:field="*{posicion}" required>
        <option value="">-- Selecciona posición --</option>
        <option value="Portero">🧤 Portero</option>
        <option value="Defensa">🛡️ Defensa</option>
        <option value="Mediocampista">⚙️ Mediocampista</option>
        <option value="Delantero">⚡ Delantero</option>
      </select>
      <br/>
      <button class="btn" type="submit">💾 Guardar Jugador</button>
    </form>
  </div>

  <div class="card list-card">
    <h2>📋 Lista de Jugadores</h2>
    <table>
      <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Número</th><th>Posición</th></tr>
      <tr th:each="j : ${jugadores}">
        <td th:text="${j.id}"></td>
        <td th:text="${j.nombre}"></td>
        <td th:text="${j.apellido}"></td>
        <td th:text="${j.numero}"></td>
        <td th:text="${j.posicion}"></td>
      </tr>
    </table>
  </div>

</div>
</body>
</html>
